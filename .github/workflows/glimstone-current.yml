name: GlimStone current

# Called by the release workflow of every app built on GlimStone, so a release
# always ships the newest GlimStone. The app's glimstone.json says which parts
# follow it, and scripts/glimstone/glimstone.mjs does the checking.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  glimstone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The script comes from the commit this workflow runs from, so a caller
      # pinned to a SHA gets the check that belongs to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .glimstone-tooling
          sparse-checkout: scripts/glimstone
          persist-credentials: false

      - name: Every part follows the newest GlimStone
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .glimstone-tooling/scripts/glimstone/glimstone.mjs check
