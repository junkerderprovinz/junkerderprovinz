name: Donation page

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install the QR library
        run: npm install -g qrcode-generator

      # The page is generated. If docs/index.html and the source disagree, somebody
      # hand-edited the output, and that is how a wrong address gets in.
      - name: The built page is the current build
        run: |
          node donate/build.mjs
          git diff --exit-code -- docs/index.html

      # A QR code cannot be proofread by eye.
      - name: Every QR encodes its own address
        run: node donate/check.mjs

      # The five wallets also live in BombVault's own donation window. Two
      # copies in two repositories cannot be held together by either repo's own
      # tests, so this reads the other one over the wire and compares.
      - name: The addresses match BombVault's own window
        run: node donate/check-app.mjs

      # Most READMEs show give.svg, four repositories copy the single files into
      # their own sprite. Both have to be the same buttons, so give.svg has to be
      # exactly what the single files build.
      - name: give.svg is built from the three buttons
        run: node donate/buttons/check-sprite.mjs
